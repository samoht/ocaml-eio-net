name: Eio PR 996 repros

# repros/: one program per eio_windows issue, under Eio 1.7, main and the
# head of ocaml-multicore/eio#996.
on:
  workflow_dispatch:
  push:
    branches: [eio-pr-996]
    paths: ['repros/**', '.github/workflows/eio-pr-996-repros.yml']

permissions:
  contents: read

jobs:
  repros:
    name: Issue repros (${{ matrix.eio }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        eio: ['1.7', 'main', 'pr996']
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.5'

      - if: matrix.eio == 'pr996'
        run: |
          opam pin add -yn iocp.dev git+https://github.com/avsm/ocaml-iocp.git#77878c74f279397bef7469957290d959146b7fb0
          opam pin add -yn eio.dev git+https://github.com/avsm/eio.git#144a7c640a784cfbd816fd79f345dd8977b821e4
          opam pin add -yn eio_windows.dev git+https://github.com/avsm/eio.git#144a7c640a784cfbd816fd79f345dd8977b821e4
          opam pin add -yn eio_main.dev git+https://github.com/avsm/eio.git#144a7c640a784cfbd816fd79f345dd8977b821e4

      - if: matrix.eio == 'main'
        run: |
          opam pin add -yn eio.dev git+https://github.com/ocaml-multicore/eio.git#f3e987cdff727c363840dd95c2e0bcea06d205c6
          opam pin add -yn eio_windows.dev git+https://github.com/ocaml-multicore/eio.git#f3e987cdff727c363840dd95c2e0bcea06d205c6
          opam pin add -yn eio_main.dev git+https://github.com/ocaml-multicore/eio.git#f3e987cdff727c363840dd95c2e0bcea06d205c6

      - if: matrix.eio == '1.7'
        run: opam install -y eio.1.7 eio_windows.1.7 eio_main.1.7

      - run: opam install -y dune eio eio_windows eio_main optint cstruct

      - run: opam exec -- dune build ./repros/r986.exe ./repros/r987.exe ./repros/r988.exe ./repros/r989.exe ./repros/r990.exe ./repros/r991.exe ./repros/r992.exe ./repros/r993.exe ./repros/r994.exe

      - shell: bash
        run: |
          set +e
          for i in 986 987 988 989 990 991 992 993 994; do
            d=$(mktemp -d)
            exe="$PWD/_build/default/repros/r$i.exe"
            echo "::group::#$i"
            (cd "$d" && timeout 60 "$exe"; echo "exit $?") 2>&1 | tee "$RUNNER_TEMP/r$i.txt"
            echo "::endgroup::"
          done
          for i in 986 987 988 989 990 991 992 993 994; do echo "== #$i"; cat "$RUNNER_TEMP/r$i.txt"; done > repros-${{ matrix.eio }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repros-${{ matrix.eio }}
          path: repros-${{ matrix.eio }}.txt
