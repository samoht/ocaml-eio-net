# The accept loop hands every exception a connection's handler raises, but
# Eio.Cancel.Cancelled, to on_error, as Eio_net.Accept.run documents: the
# handler is the caller's code, and one failed connection must not end the
# listener.
[[rules]]
files = ["lib/accept.ml"]
exclude = ["E105"]

# The trace is a small unquoted table the test's own generator writes, read
# with String.split_on_char: a CSV library would add a test dependency for it.
[[rules]]
files = ["test/interop/cpython-struct/*"]
exclude = ["E825"]

# Eio_net only re-exports its modules, each tested in its own file.
[[rules]]
files = ["lib/eio_net.ml"]
exclude = ["E605"]

# The oracle records whatever an operation raises as its outcome, so it
# catches every exception but cancellation; and its cases compare eio-net.mem
# and real sockets with gVisor's tests rather than test one library module.
[[rules]]
files = ["test/oracle/*"]
exclude = ["E105", "E610"]

# The kernel's traces are an unquoted table the recorder writes, read with
# String.split_on_char, as for the cpython-struct traces. A sequence records
# whatever an operation raises as its outcome, and the replay tests mem as a
# whole rather than one library module.
[[rules]]
files = ["test/interop/kernel/*", "test/interop/kernel/*/*"]
exclude = ["E825", "E105", "E610"]

# The connect timeouts are an unquoted table the generator writes, read with
# String.split_on_char, as for the kernel's traces.
[[rules]]
files = ["test/interop/connect-timeout/*"]
exclude = ["E825"]

# The chaos check's tests, with the programs and mutants they run: they test check as a whole rather than one library module.
[[rules]]
files = ["test/chaos/*"]
exclude = ["E610"]

# The errors eio_posix raises, built where the Hermetic prelude cannot refuse
# Eio_unix; the wrapper's tests match each of them.
[[rules]]
files = ["lib/chaos/posix.ml"]
exclude = ["E605"]

# The provenance test checks the committed traces and their generators, not a
# library module.
[[rules]]
files = ["test/provenance/*"]
exclude = ["E610"]

# The validation test compiles copies of eio-net.mem's private modules, to
# check that pure function alone against the kernel's traces: it links no
# library of its own.
[[rules]]
files = ["test/interop/kernel/validation/*"]
exclude = ["E606"]

# The law's test compiles copies of the chaos wrapper's private modules, to
# check each row against what the wrapper does: it links no chaos library.
[[rules]]
files = ["test/law/*"]
exclude = ["E606"]

# Scope's behaviours and options are tables of records, written through
# feature and both so that a row shared by both kernels is written once: they
# hold no logic, but the rule exempts a table only as bare literals.
[[rules]]
files = ["lib/mem/scope.ml"]
exclude = ["E005"]

# The silent connections are an unquoted table the generator writes, read
# with String.split_on_char, as for the connect timeouts.
[[rules]]
files = ["test/interop/silent-peer/*"]
exclude = ["E825"]

# The kernel's sequences and scenarios, moved from the oracle's test tree: a
# sequence records whatever an operation raises as its outcome, and each
# scenario is one script, listed in tables.
[[rules]]
files = ["lib/kernel/*"]
exclude = ["E105", "E005"]

# The allowances of the conformance check are a table of records, one per way a
# host's answer may differ: they hold no logic.
[[rules]]
files = ["lib/chaos/conformance.ml"]
exclude = ["E005"]

# Dune's select picks one of these as posix.ml, which posix.mli describes.
[[rules]]
files = ["test/posix/posix.eio_posix.ml", "test/posix/posix.none.ml"]
exclude = ["E505"]

# The regen rules are REGEN-gated in a conjunction with the host, as each host
# records its own columns and two rules with the same targets cannot both be
# enabled; E815 reads only a bare (= %{env:REGEN=0} 1) guard.
[[rules]]
files = ["test/interop/kernel/traces/dune"]
exclude = ["E815"]
