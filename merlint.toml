# The accept loop hands every exception a connection's handler raises, but
# Eio.Cancel.Cancelled, to on_error, as Eio_net_accept.run documents: the
# handler is the caller's code, and one failed connection must not end the
# listener.
[[rules]]
files = ["lib/accept/eio_net_accept.ml"]
exclude = ["E105"]

# The trace is a small unquoted table the test's own generator writes, read
# with String.split_on_char: a CSV library would add a test dependency for it.
[[rules]]
files = ["test/interop/cpython-struct/*"]
exclude = ["E825"]

# Eio_net only re-exports Frame, Datagram, Relay and Progress, each tested in
# its own file.
[[rules]]
files = ["lib/eio_net.ml"]
exclude = ["E605"]

# The oracle records whatever an operation raises as its outcome, so it
# catches every exception but cancellation; and its cases compare eio-net.mem
# and real sockets with gVisor's tests rather than test one library module.
[[rules]]
files = ["test/oracle/*"]
exclude = ["E105", "E610"]

# The kernel's traces are an unquoted table the recorder writes, read with
# String.split_on_char, as for the cpython-struct traces. A sequence records
# whatever an operation raises as its outcome, and the replay tests mem as a
# whole rather than one library module.
[[rules]]
files = ["test/interop/kernel/*", "test/interop/kernel/*/*"]
exclude = ["E825", "E105", "E610"]

# A copy of Eio_mock's scheduler, kept as close to it as the changes allow.
[[rules]]
files = ["lib/chaos/quiet_mock.ml"]
exclude = ["E005"]

# A check reports whatever its workload raises as the failure of a run: any
# exception that escapes the workload fails the check.
[[rules]]
files = ["lib/chaos/eio_net_chaos.ml"]
exclude = ["E105"]

# The design's tests of the chaos API, with the programs and mutants they
# run: they test check as a whole rather than one library module.
[[rules]]
files = ["test/chaos/*"]
exclude = ["E610"]

# The errors eio_posix raises, built where the Hermetic prelude cannot refuse
# Eio_unix; the wrapper's tests match each of them.
[[rules]]
files = ["lib/chaos/posix.ml"]
exclude = ["E605"]
